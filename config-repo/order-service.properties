spring.application.name=order-service
server.port=8082

logging.level.io.github.resilience4j.retry=DEBUG

# Eureka Server
eureka.client.service-url.defaultZone=http://localhost:8081/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

spring.datasource.url=jdbc:postgresql://localhost:5433/order_db
spring.datasource.username=mohamed
spring.datasource.password=mohamed

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


# Circuit Breaker Configuration
resilience4j.circuitbreaker.instances.productService.registerHealthIndicator=true

resilience4j.circuitbreaker.instances.productService.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.productService.slidingWindowSize=5

resilience4j.circuitbreaker.instances.productService.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.productService.failureRateThreshold=50

resilience4j.circuitbreaker.instances.productService.waitDurationInOpenState=10s

resilience4j.circuitbreaker.instances.productService.permittedNumberOfCallsInHalfOpenState=2
resilience4j.circuitbreaker.instances.productService.automaticTransitionFromOpenToHalfOpenEnabled=true

# OpenFeign Timeout Configuration
spring.cloud.openfeign.client.config.PRODUCT-SERVICE.connectTimeout=2000
spring.cloud.openfeign.client.config.PRODUCT-SERVICE.readTimeout=3000

# Retry Configuration
resilience4j.retry.instances.productServiceRetry.maxAttempts=3
resilience4j.retry.instances.productServiceRetry.waitDuration=2s
resilience4j.retry.instances.productServiceRetry.enableExponentialBackoff=false

# Retry executes outside Circuit Breaker
resilience4j.retry.retryAspectOrder=1

# Circuit Breaker executes inside Retry
resilience4j.circuitbreaker.circuitBreakerAspectOrder=2

# Bulkhead Configuration
resilience4j.bulkhead.instances.productServiceBulkhead.maxConcurrentCalls=3
resilience4j.bulkhead.instances.productServiceBulkhead.maxWaitDuration=0

# Rate Limiter Configuration
resilience4j.ratelimiter.instances.productServiceRateLimiter.limitForPeriod=5
resilience4j.ratelimiter.instances.productServiceRateLimiter.limitRefreshPeriod=1s
resilience4j.ratelimiter.instances.productServiceRateLimiter.timeoutDuration=0