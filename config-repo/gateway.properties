spring.application.name=gateway
server.port=8088

# Eureka Server
eureka.client.service-url.defaultZone=http://localhost:8081/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true


# API Gateway Service Routing

# Product Service
spring.cloud.gateway.routes[0].id=product-route
spring.cloud.gateway.routes[0].rui=lb://PAYMENT-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=path=/products/**

# Order Service
spring.cloud.gateway.routes[1].id=order-route
spring.cloud.gateway.routes[1].rui=lb://ORDER-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=path=orders/**

# Customer Service
spring.cloud.gateway.routes[2].id=customer-route
spring.cloud.gateway.routes[2].uri=lb://CUSTOMER-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/customers/**

# Payment Service
spring.cloud.gateway.routes[3].id=payment-route
spring.cloud.gateway.routes[3].uri=lb://PAYMENT-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/payments/**

# Notification Service
spring.cloud.gateway.routes[4].id=notification-route
spring.cloud.gateway.routes[4].uri=lb://NOTIFICATION-SERVICE
spring.cloud.gateway.routes[4].predicates[0]=Path=/notifications/**
